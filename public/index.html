<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Sensor Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f3; color: #0b0b0b; padding: 1.5rem; }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 1.5rem; }
    .status-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 1.5rem; font-size: 13px; color: #52514e; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #0ca30c; flex-shrink: 0; animation: pulse 2s infinite; }
    .status-dot.off { background: #e34948; animation: none; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .refresh-btn { margin-left: auto; font-size: 12px; cursor: pointer; background: none; border: 1px solid #ccc; border-radius: 6px; padding: 5px 12px; color: #52514e; }
    .refresh-btn:hover { background: #eee; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
    .metric { background: #fff; border-radius: 8px; padding: 1rem; border: 1px solid #e5e5e3; }
    .metric-label { font-size: 12px; color: #898781; margin-bottom: 4px; }
    .metric-value { font-size: 26px; font-weight: 500; line-height: 1.1; }
    .metric-unit { font-size: 13px; font-weight: 400; color: #52514e; }
    .metric-delta { font-size: 12px; margin-top: 4px; color: #898781; }
    .metric-date { font-size: 11px; color: #898781; margin-top: 6px; }
    .chart-card { background: #fff; border-radius: 12px; border: 1px solid #e5e5e3; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .chart-title { font-size: 13px; font-weight: 500; color: #52514e; margin-bottom: 1rem; }
    .last-update { font-size: 12px; color: #898781; text-align: right; margin-top: 0.5rem; }
    .readings-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 0.5rem; }
    .readings-table th { background: #f5f5f3; text-align: left; padding: 8px 12px; font-weight: 500; color: #52514e; border-bottom: 1px solid #e5e5e3; }
    .readings-table td { padding: 8px 12px; border-bottom: 1px solid #f0f0ee; color: #0b0b0b; }
    .readings-table tr:last-child td { border-bottom: none; }
    .readings-table tr:hover td { background: #fafaf9; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    .badge-temp { background: #FEE2E2; color: #C0392B; }
    .badge-pres { background: #DBEAFE; color: #1F618D; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a19; color: #fff; }
      .metric, .chart-card { background: #2c2c2a; border-color: #383835; }
      .metric-label, .chart-title, .metric-date { color: #c3c2b7; }
      .metric-unit, .metric-delta { color: #898781; }
      .status-bar { color: #c3c2b7; }
      .refresh-btn { border-color: #383835; color: #c3c2b7; }
      .refresh-btn:hover { background: #383835; }
      .readings-table th { background: #383835; color: #c3c2b7; border-color: #383835; }
      .readings-table td { border-color: #383835; color: #fff; }
      .readings-table tr:hover td { background: #383835; }
    }
  </style>
</head>
<body>
  <h1>ESP32 Sensor Dashboard</h1>

  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Conectando...</span>
    <button class="refresh-btn" onclick="fetchData()">↻ Actualizar</button>
  </div>

  <div class="metrics">
    <div class="metric">
      <p class="metric-label">Temperatura</p>
      <p class="metric-value" id="tempVal">—<span class="metric-unit"> °C</span></p>
      <p class="metric-delta" id="tempDelta">—</p>
      <p class="metric-date" id="tempDate">—</p>
    </div>
    <div class="metric">
      <p class="metric-label">Presión</p>
      <p class="metric-value" id="presVal">—<span class="metric-unit"> hPa</span></p>
      <p class="metric-delta" id="presDelta">—</p>
      <p class="metric-date" id="presDate">—</p>
    </div>
    <div class="metric">
      <p class="metric-label">Temp. máxima</p>
      <p class="metric-value" id="tempMax">—<span class="metric-unit"> °C</span></p>
    </div>
    <div class="metric">
      <p class="metric-label">Temp. mínima</p>
      <p class="metric-value" id="tempMin">—<span class="metric-unit"> °C</span></p>
    </div>
  </div>

  <div class="chart-card">
    <p class="chart-title">Temperatura (°C)</p>
    <div style="position: relative; height: 220px;">
      <canvas id="tempChart"></canvas>
    </div>
  </div>

  <div class="chart-card">
    <p class="chart-title">Presión atmosférica (hPa)</p>
    <div style="position: relative; height: 220px;">
      <canvas id="presChart"></canvas>
    </div>
  </div>

  <div class="chart-card">
    <p class="chart-title">Últimas lecturas</p>
    <table class="readings-table">
      <thead>
        <tr>
          <th>Fecha y Hora</th>
          <th>Temperatura</th>
          <th>Presión</th>
          <th>Dispositivo</th>
        </tr>
      </thead>
      <tbody id="readingsBody">
        <tr><td colspan="4" style="text-align:center; color:#898781;">Cargando...</td></tr>
      </tbody>
    </table>
  </div>

  <p class="last-update" id="lastUpdate">—</p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script>
    const FIREBASE_URL = "https://esp32aws-903f7-default-rtdb.firebaseio.com";
    const FIREBASE_SECRET = "5C88hVZ8RuJpAYQz6sXXrTkYY1B3wl4mT3JKaauU";

    let tempChart, presChart;

    function formatDate(ts) {
      if (!ts) return '—';
      // Si es string ISO (del NTP)
      if (typeof ts === 'string' && ts.includes('T')) {
        const d = new Date(ts);
        return d.toLocaleString('es-PA', { 
          day: '2-digit', month: '2-digit', year: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
      }
      // Si es número (millis del ESP32 — tiempo relativo)
      if (typeof ts === 'number') {
        const secs = Math.floor(ts / 1000);
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        const s = secs % 60;
        return `T+${h}h ${m}m ${s}s`;
      }
      return String(ts);
    }

    function shortTime(ts) {
      if (!ts) return '—';
      if (typeof ts === 'string' && ts.includes('T')) {
        const d = new Date(ts);
        return d.toLocaleTimeString('es-PA', { hour: '2-digit', minute: '2-digit' });
      }
      return String(ts);
    }

    function initCharts() {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const gridColor = isDark ? '#383835' : '#e1e0d9';
      const tickColor = '#898781';

      const commonOpts = (label, color) => ({
        type: 'line',
        data: { labels: [], datasets: [{ label, data: [], borderColor: color, backgroundColor: color + '20',
          borderWidth: 2, pointRadius: 3, pointBackgroundColor: color, tension: 0.3, fill: true }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: tickColor, font: { size: 11 }, maxTicksLimit: 8 }, grid: { color: gridColor } },
            y: { ticks: { color: tickColor, font: { size: 11 } }, grid: { color: gridColor } }
          }
        }
      });

      tempChart = new Chart(document.getElementById('tempChart'), commonOpts('Temperatura', '#2a78d6'));
      presChart = new Chart(document.getElementById('presChart'), commonOpts('Presión', '#1baf7a'));
    }

    async function fetchData() {
      try {
        const res = await fetch(`${FIREBASE_URL}/sensores.json?auth=${FIREBASE_SECRET}`);
        const data = await res.json();

        if (!data) { setStatus(false, 'Sin datos en Firebase'); return; }

        const readings = Object.values(data)
          .filter(r => r && r.temperatura && r.temperatura !== 0)
          .sort((a, b) => {
            // Ordenar por timestamp string ISO o número
            const ta = typeof a.timestamp === 'string' ? new Date(a.timestamp).getTime() : a.timestamp;
            const tb = typeof b.timestamp === 'string' ? new Date(b.timestamp).getTime() : b.timestamp;
            return ta - tb;
          });

        if (!readings.length) { setStatus(false, 'Sin lecturas válidas'); return; }

        const last20 = readings.slice(-20);
        updateMetrics(last20);
        updateCharts(last20);
        updateTable(readings.slice(-10).reverse());
        setStatus(true, `ESP32_BMP280 · ${readings.length} lecturas totales`);
        document.getElementById('lastUpdate').textContent =
          'Última actualización: ' + new Date().toLocaleTimeString('es-PA');
      } catch(e) {
        setStatus(false, 'Error de conexión a Firebase');
        console.error(e);
      }
    }

    function updateMetrics(readings) {
      const last = readings[readings.length - 1];
      const prev = readings[readings.length - 2];
      const temps = readings.map(r => r.temperatura);

      document.getElementById('tempVal').innerHTML = `${last.temperatura.toFixed(1)}<span class="metric-unit"> °C</span>`;
      document.getElementById('presVal').innerHTML = `${last.presion.toFixed(1)}<span class="metric-unit"> hPa</span>`;
      document.getElementById('tempMax').innerHTML = `${Math.max(...temps).toFixed(1)}<span class="metric-unit"> °C</span>`;
      document.getElementById('tempMin').innerHTML = `${Math.min(...temps).toFixed(1)}<span class="metric-unit"> °C</span>`;
      document.getElementById('tempDate').textContent = '🕐 ' + formatDate(last.timestamp);
      document.getElementById('presDate').textContent = '🕐 ' + formatDate(last.timestamp);

      if (prev) {
        const tDiff = (last.temperatura - prev.temperatura).toFixed(1);
        const pDiff = (last.presion - prev.presion).toFixed(1);
        const tEl = document.getElementById('tempDelta');
        tEl.textContent = (tDiff >= 0 ? '▲ +' : '▼ ') + tDiff + '°C vs anterior';
        tEl.style.color = tDiff >= 0 ? '#0ca30c' : '#e34948';
        const pEl = document.getElementById('presDelta');
        pEl.textContent = (pDiff >= 0 ? '▲ +' : '▼ ') + pDiff + ' hPa vs anterior';
        pEl.style.color = pDiff >= 0 ? '#0ca30c' : '#e34948';
      }
    }

    function updateCharts(readings) {
      const labels = readings.map(r => shortTime(r.timestamp));
      tempChart.data.labels = labels;
      tempChart.data.datasets[0].data = readings.map(r => parseFloat(r.temperatura.toFixed(1)));
      tempChart.update();
      presChart.data.labels = labels;
      presChart.data.datasets[0].data = readings.map(r => parseFloat(r.presion.toFixed(1)));
      presChart.update();
    }

    function updateTable(readings) {
      const tbody = document.getElementById('readingsBody');
      tbody.innerHTML = readings.map(r => `
        <tr>
          <td>${formatDate(r.timestamp)}</td>
          <td><span class="badge badge-temp">${r.temperatura.toFixed(1)} °C</span></td>
          <td><span class="badge badge-pres">${r.presion.toFixed(1)} hPa</span></td>
          <td>${r.deviceId || 'ESP32_BMP280'}</td>
        </tr>
      `).join('');
    }

    function setStatus(online, text) {
      document.getElementById('statusDot').className = 'status-dot' + (online ? '' : ' off');
      document.getElementById('statusText').textContent = text;
    }

    initCharts();
    fetchData();
    setInterval(fetchData, 15000);
  </script>
</body>
</html>
